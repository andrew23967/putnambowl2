{% extends 'base.html' %}
{% block title %}Rules{% endblock %}

{% block content %}
<div class="page-head">
  <div class="page-head-title">
    <p class="eyebrow">Rules</p>
    <p class="meta">{{ league.name }}</p>
  </div>
  {% if is_manager %}
  <div class="page-head-end"><a class="btn btn-secondary btn-sm" href="{% url 'main:rulesdash' %}">Edit</a></div>
  {% endif %}
</div>

{% if league.rules %}
<div class="prose" style="margin-top:24px;">{{ league.rules|linebreaks }}</div>
{% else %}
<p class="empty" style="margin-top:20px;">No rules posted.</p>
{% endif %}
{% endblock %}
